<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- EyeRest favicon: parchment tile + amber rising-bars mark.
       Inline @media adapts to the viewer's OS theme (zero-blue). -->
  <style>
    .bg { fill: #ece8d8; }
    .fg { fill: #7a6010; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1c1a14; }
      .fg { fill: #c8a858; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="6" />
  <rect class="fg" x="6" y="18" width="4" height="8" rx="1" />
  <rect class="fg" x="14" y="13" width="4" height="13" rx="1" />
  <rect class="fg" x="22" y="7" width="4" height="19" rx="1" />
</svg>
