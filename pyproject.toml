[project]
name = "ajoa-kit"
version = "0.1.0"
description = "Agentic job-offer-to-application kit: feed/API-first JD ingestion, pre-filter, and LLM relevance screening."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "qte77" }]
classifiers = ["License :: OSI Approved :: Apache Software License"]
# polyfetch-scrape is invoked ad-hoc via `uv run --directory`, never installed here.
dependencies = [
    "defusedxml>=0.7.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.scripts]
ajoa-kit = "ajoa_kit.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-cov>=7.0",
    "ruff>=0.6",
    "scriv[toml]>=1.8",
    "pyright>=1.1.400",
    "complexipy>=5.6.1",
    "hypothesis>=6.151.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ajoa_kit"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP",      # baseline
    "B", "S", "SIM", "RUF", "PT",       # quality
    "ANN", "TC", "PGH", "C90", "D",     # strictness
    "TRY",                              # try/except discipline
]
ignore = [
    "TRY003",  # long error messages outside exception classes — noisy on one-off defensive raises
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]      # asserts + no docstrings
"scripts/**" = ["D", "ANN"]     # one-off scripts; over-annotating is noise

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src/ajoa_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits the live network (deselect with -m 'not network')"]

# Coverage gate (#33). The floor is set to current coverage to prevent
# regression — it is NOT a target to chase with trivial tests (value-add tests
# only). Raise it only when real tests land. `make check` runs with --cov.
[tool.coverage.run]
source = ["ajoa_kit"]

[tool.coverage.report]
show_missing = true
fail_under = 41

# Changelog fragments — each PR adds one under changelog.d/ via `make
# changelog_new`; `make changelog_preview` shows the assembled entry;
# `make changelog_release VERSION=X.Y.Z` collects them into CHANGELOG.md
# at the `<!-- scriv-insert-here -->` marker. Categories mirror the
# Keep-a-Changelog preamble; fragment headings sit at h3 (md_header_level + 1).
[tool.scriv]
format = "md"
fragment_directory = "changelog.d"
categories = ["Added", "Changed", "Deprecated", "Removed", "Fixed", "Security"]
md_header_level = "2"
entry_title_template = "[{{ version }}] - {{ date.strftime('%Y-%m-%d') }}"
md_html_anchors = false
