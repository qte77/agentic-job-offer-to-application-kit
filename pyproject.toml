[project]
name = "ajoa-kit"
version = "0.8.0"
description = "Agentic job-offer-to-application kit: feed/API-first JD ingestion, pre-filter, and LLM relevance screening."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "qte77" }]
classifiers = ["License :: OSI Approved :: Apache Software License"]
# polyfetch-scrape is invoked ad-hoc via `uv run --directory`, never installed here.
dependencies = [
    "defusedxml>=0.7.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.14.2",
]

# Optional, lazy-imported extra (#275): `uv sync --extra pdf` enables `ajoa-kit render-pdf`.
# Never core — render_pdf.py imports fpdf2/markdown-it inside functions so it loads without these.
[project.optional-dependencies]
pdf = ["fpdf2>=2.8", "markdown-it-py>=3.0"]

[project.scripts]
ajoa-kit = "ajoa_kit.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0",
    "ruff>=0.16.1",
    "scriv[toml]>=1.8",
    "bump-my-version>=1.5.0",
    "pyright>=1.1.411",
    # Pinned <6: complexipy 6.0 changed its cognitive-complexity scoring and rates
    # persist_scored.main / refresh.main at 14 / 11 (were 9 / 8 under 5.x), breaking the ≤10 gate.
    # Adopting 6.x is a deliberate task (refactor those two mains), not a Dependabot drive-by.
    "complexipy>=5.6.1,<8",
    "hypothesis>=6.165.1",
    # PDF extra, in dev too so `make check` can live-render (render_pdf still lazy-imports them).
    "fpdf2>=2.8",
    "markdown-it-py>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ajoa_kit"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP",      # baseline
    "B", "S", "SIM", "RUF", "PT",       # quality
    "ANN", "TC", "PGH", "C90", "D",     # strictness
    "TRY",                              # try/except discipline
]
ignore = [
    "TRY003",  # long error messages outside exception classes — noisy on one-off defensive raises
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]      # asserts + no docstrings
"scripts/**" = ["D", "ANN"]     # one-off scripts; over-annotating is noise

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src/ajoa_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits the live network (deselect with -m 'not network')"]

# Coverage gate (#33). The floor is set to current coverage to prevent
# regression — it is NOT a target to chase with trivial tests (value-add tests
# only). Raise it only when real tests land. `make check` runs with --cov.
[tool.coverage.run]
source = ["ajoa_kit"]

[tool.coverage.report]
show_missing = true
fail_under = 80

# Changelog fragments — each PR adds one under changelog.d/ via `make
# changelog_new`; `make changelog_preview` shows the assembled entry;
# `make changelog_release VERSION=X.Y.Z` collects them into CHANGELOG.md
# at the `<!-- scriv-insert-here -->` marker. Categories mirror the
# Keep-a-Changelog preamble; fragment headings sit at h3 (md_header_level + 1).
[tool.scriv]
format = "md"
fragment_directory = "changelog.d"
categories = ["Added", "Changed", "Deprecated", "Removed", "Fixed", "Security"]
md_header_level = "2"
entry_title_template = "[{{ version }}] - {{ date.strftime('%Y-%m-%d') }}"
md_html_anchors = false

# Version bumping (release flow). `gh workflow run bump-my-version.yaml -f bump_type=…`
# rewrites the version files below and syncs uv.lock + collects fragments. The qte77/.github
# bump-version reusable (#193) commits the result via the GitHub API (signed) and opens a
# `chore(release)` PR; `tag-release.yaml` tags the merge commit. So bump-my-version must NOT
# commit or tag itself — files-only (commit/tag = false), else it aborts on the runner with
# "empty ident name" (no git identity is configured for a files-only bump). See CONTRIBUTING "Releasing".
[tool.bumpversion]
current_version = "0.8.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = false
tag = false
allow_dirty = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "v{new_version}"
message = "chore(release): bump {current_version} -> {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/ajoa_kit/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "README.md"
search = "version-{current_version}-blue"
replace = "version-{new_version}-blue"

[[tool.bumpversion.files]]
filename = "ui/index.html"
search = 'app-version">{current_version}<'
replace = 'app-version">{new_version}<'
