---
name: Deploy Pages

# Publishes the static ui/ dashboard to the `gh-pages` branch (Pages source =
# that branch). Ships the synthetic shortlist (no PII) plus a SAME-ORIGIN copy of
# the PII-free aggregate trends ({week,counts}) pulled from the `data` branch at
# deploy time, so the live charts render real data without a fragile cross-origin
# runtime fetch (raw.githubusercontent is rate-limited / blocked on some networks).
# The live *shortlist* stays gated on #52 (PII); aggregate trends are not.
#
# Deploys on every push to main/data (no `paths:` filter): `make trends-data`
# force-pushes a PARENTLESS commit to the `data` branch, so GitHub has no parent
# to diff against and a `paths:` filter would never match — the trends refresh
# would silently never redeploy. The job is fast (~20 s) and idempotent, so
# running it on every push is cheaper than the staleness bug (#251).
#
# Why a branch push instead of actions/upload-pages-artifact + deploy-pages:
# the repo enforces `sha_pinning_required`, and upload-pages-artifact internally
# calls actions/upload-artifact@v4 by tag (un-pinnable from here), which the
# policy rejects. This job uses only actions/checkout (SHA-pinned, GitHub-owned)
# + git, so it stays compliant. No build step — the site is copied as-is.
on:
  push:
    branches: [main, data]
  workflow_dispatch:

permissions: {}

# Serialize deploys; don't cancel an in-flight one (GitHub Pages guidance).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish ui/ to gh-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # push the gh-pages branch
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Always deploy the default branch's ui/ — even when triggered by a `data`-branch push
          # (which carries no ui/); the trends are pulled from the data branch via git fetch below.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Publish ui/ to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The bundled weekly series (single point of edit for this step, #249 slice D).
          TRENDS_FILE: public-data/trends.ndjson
        run: |
          set -euo pipefail
          site="$(mktemp -d)"
          cp -r ui/. "$site/"
          # Bundle the latest PII-free aggregate trends ({week,counts}) from the `data` branch so the
          # dashboard loads them SAME-ORIGIN — no cross-origin runtime fetch to raw.githubusercontent
          # (rate-limited / blocked by some networks & extensions -> silent synthetic fallback).
          dst="$site/public/data/$(basename "$TRENDS_FILE")"
          if git fetch --depth=1 origin data 2>/dev/null \
            && git show "origin/data:$TRENDS_FILE" > "$dst" 2>/dev/null; then
            echo "bundled $(wc -l < "$dst") trend records from the data branch"
          else
            rm -f "$dst"
            echo "no data-branch trends; dashboard falls back to runtime fetch / synthetic"
          fi
          # Stamp the real deploy date into the published copy (no-build; the committed
          # #gen-date value is only the local-preview default).
          sed -i -E "s#(<span id=\"gen-date\">)[^<]*#\1$(date -u +%F)#" "$site/index.html"
          touch "$site/.nojekyll"  # serve paths verbatim (no Jekyll processing)
          cd "$site"
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Deploy ui/ from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
...
