---
name: Deploy Pages

# Publishes the static ui/ dashboard to the `gh-pages` branch (Pages source =
# that branch). Ships the synthetic shortlist (no PII) plus a SAME-ORIGIN copy of
# the PII-free aggregate trends ({week,counts}) pulled from the `data` branch at
# deploy time, so the live charts render real data without a fragile cross-origin
# runtime fetch (raw.githubusercontent is rate-limited / blocked on some networks).
# The live *shortlist* stays gated on #52 (PII); aggregate trends are not.
#
# Deploys on every push to main/data (no `paths:` filter): `make trends-data`
# force-pushes a PARENTLESS commit to the `data` branch, so GitHub has no parent
# to diff against and a `paths:` filter would never match — the trends refresh
# would silently never redeploy. The job is fast (~20 s) and idempotent, so
# running it on every push is cheaper than the staleness bug (#251).
#
# NOTE: the nightly `ingest-daily.yaml` cron pushes to `data` with GITHUB_TOKEN,
# and a GITHUB_TOKEN push does NOT fire push-triggered workflows (loop prevention).
# So the cron dispatches this workflow explicitly (workflow_dispatch) after its
# push; only local/human `data` pushes and `main` pushes self-trigger here (#251).
#
# Why a branch push instead of actions/upload-pages-artifact + deploy-pages:
# the repo enforces `sha_pinning_required`, and upload-pages-artifact internally
# calls actions/upload-artifact@v4 by tag (un-pinnable from here), which the
# policy rejects. This job uses only actions/checkout (SHA-pinned, GitHub-owned)
# + git, so it stays compliant. No build step — the site is copied as-is.
on:
  push:
    branches: [main, data]
  workflow_dispatch:

permissions: {}

# Serialize deploys; don't cancel an in-flight one (GitHub Pages guidance).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish ui/ to gh-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # push the gh-pages branch
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Always deploy the default branch's ui/ — even when triggered by a `data`-branch push
          # (which carries no ui/); the trends are pulled from the data branch via git fetch below.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Publish ui/ to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The bundled aggregate series — keyword trends weekly+daily+monthly (#187/#188) and the
          # geo×field hiring weekly+daily+monthly (plan 006). Mirrors the Makefile TRENDS_PUBLISH
          # allowlist; weekly is each load default, the finer/coarser series back the granularity
          # dropdowns. No company-named file is ever bundled. Single point of edit for this step.
          TRENDS_FILES: >-
            public-data/trends.ndjson
            public-data/trends-daily.ndjson
            public-data/trends-monthly.ndjson
            public-data/hiring-weekly.ndjson
            public-data/hiring-daily.ndjson
            public-data/hiring-monthly.ndjson
        run: |
          set -euo pipefail
          site="$(mktemp -d)"
          cp -r ui/. "$site/"
          # Bundle the latest PII-free aggregate trends ({<label>,counts}) from the `data` branch so the
          # dashboard loads them SAME-ORIGIN — no cross-origin runtime fetch to raw.githubusercontent
          # (rate-limited / blocked by some networks & extensions -> silent synthetic fallback). Each
          # series present on the branch is copied; a missing one is skipped (that granularity then
          # falls back to the runtime fetch / synthetic).
          if git fetch --depth=1 origin data 2>/dev/null; then
            # shellcheck disable=SC2086  # intentional word-split over the space-separated file list
            for f in $TRENDS_FILES; do
              dst="$site/public/data/$(basename "$f")"
              if git show "origin/data:$f" > "$dst" 2>/dev/null; then
                echo "bundled $(wc -l < "$dst") records from $f"
              else
                rm -f "$dst"
                echo "no $f on the data branch (skipped)"
              fi
            done
          else
            echo "no data branch; dashboard falls back to runtime fetch / synthetic"
          fi
          # Stamp the real deploy date into the published copy (no-build; the committed
          # #gen-date value is only the local-preview default).
          sed -i -E "s#(<span id=\"gen-date\">)[^<]*#\1$(date -u +%F)#" "$site/index.html"
          touch "$site/.nojekyll"  # serve paths verbatim (no Jekyll processing)
          cd "$site"
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Deploy ui/ from ${GITHUB_SHA}"
          # Keep the token out of argv and out of stored config: a lazy credential helper
          # expands ${GH_TOKEN} at git's runtime, so it never lands in `ps`/`/proc/<pid>/cmdline`
          # or in `.git/config` (#256).
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          # shellcheck disable=SC2016  # intentional: ${GH_TOKEN} must stay literal here and
          # expand only when git invokes the helper, so it never reaches argv or stored config.
          git config credential.helper '!f() { echo "username=x-access-token"; echo "password=${GH_TOKEN}"; }; f'
          git push -f origin gh-pages
...
