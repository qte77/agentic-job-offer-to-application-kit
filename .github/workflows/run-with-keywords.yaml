---
# Run the keyword-trend pipeline with a consumer-supplied keyword set and emit the keyword-only
# NDJSON as an artifact. Two entry points:
#   - workflow_dispatch: manual / local demo runs.
#   - workflow_call:    reusable — another repo (e.g. ai-agents-research) calls this with `keywords`.
# The demo path uses the committed synthetic example corpus (examples/alexis-doe/results/jobs-raw.json),
# so it needs no network / polyfetch. Output is keyword-only by construction ({week, counts}) — it
# carries no JD text/company/title/url, so it clears the ADR-0001 PII gate (#11, #79).
# Real-source ingestion (live `ajoa-kit ingest`) is a consumer / self-hosted concern — see #56 / Stream 2.
name: Run with keywords

on:
  workflow_dispatch:
    inputs:
      keywords:
        description: 'Keyword set as JSON: {"interest": [...], "title_roles": [...]}'
        required: true
        type: string
  workflow_call:
    inputs:
      keywords:
        description: 'Keyword set as JSON: {"interest": [...], "title_roles": [...]}'
        required: true
        type: string

permissions:
  contents: read

jobs:
  trends:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Stage consumer keywords + demo corpus
        env:
          KEYWORDS: ${{ inputs.keywords }}  # via env, never inlined into the shell — no injection
        run: |
          set -euo pipefail
          mkdir -p config results
          printf '%s' "$KEYWORDS" > config/keywords.json
          cp examples/alexis-doe/results/jobs-raw.json results/jobs-raw.json

      - name: Snapshot keyword-only trends
        run: uv run ajoa-kit trend-snapshot

      - name: Upload keyword-only trends
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: keyword-trends
          path: public-data/trends.ndjson
          if-no-files-found: error
...
