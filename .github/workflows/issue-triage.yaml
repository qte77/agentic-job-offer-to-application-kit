---
name: Issue Triage

# AI-powered triage (duplicate detection, relevance/feasibility, auto-labeling) on newly
# opened issues. Backend: Cloudflare Workers AI (GitHub Models was retired 2026-07-30).
# Needs repo secrets CF_WORKERS_AI_TOKEN and LLM_BASE_URL; no `models: read`.
on:
  issues:
    types: [opened]

permissions: {}

jobs:
  triage:
    name: AI issue triage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Triage issue
        uses: qte77/gha-issue-triage@dc115f9223884fd0eb94d084287320c4157cf91b  # v0.7.1
        with:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          llm-api-key: ${{ secrets.CF_WORKERS_AI_TOKEN }}
          api_base: ${{ secrets.LLM_BASE_URL }}
          MODEL: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
