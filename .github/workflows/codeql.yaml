---
# https://github.blog/changelog/2025-10-28-upcoming-deprecation-of-codeql-action-v3/
name: "CodeQL"

# Docs-only changes skip CodeQL (no code to analyze). Only the push trigger gets
# the filter; the weekly schedule always runs. Keep this list in sync with ci.yaml.
on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'changelog.d/**'
      - 'examples/**/*.md'
      - '*.md'
      - 'lychee.toml'
      - '.markdownlint-cli2.jsonc'
  schedule:
    - cron: '27 11 * * 0'
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3  # v4
      with:
        languages: ${{ vars.CODEQL_LANGUAGES || 'python' }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3  # v4

    - name: Perform CodeQL Analysis
      id: analyze
      uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3  # v4
      with:
        output: sarif-results

    - name: Dismiss alerts with inline suppression comments
      uses: advanced-security/dismiss-alerts@a18f986bdb40edba0dd7a74382c15d4a3d50a1c8  # v2.0.3
      with:
        sarif-id: ${{ steps.analyze.outputs.sarif-id }}
        sarif-file: sarif-results
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
