---
name: bump-my-version

# Thin caller: delegates the version bump to the estate-standard reusable
# workflow (qte77/.github, #193). Behavior is unchanged — bumps the
# [tool.bumpversion] files (pyproject.toml + README badge + __init__.py +
# ui/index.html footer), syncs uv.lock, collects changelog.d/ fragments into
# CHANGELOG.md, and opens a `chore(release)` PR. Tagging stays deferred to
# tag-release.yaml (the reusable bumps with --no-tag on the uv path), so the
# v{new} tag lands on main's squash-merge commit. The opened PR is bot-authored
# (GITHUB_TOKEN) so its checks idle at action_required until a real-user event
# — see CONTRIBUTING "Releasing".

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Semver part to bump"
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    uses: qte77/.github/.github/workflows/bump-version.yml@b03592321e529d0d136b35852fc9045e96c65159  # 2026-07-18
    with:
      bump_type: ${{ inputs.bump_type }}
      use_uv: true
      sync_lockfile: true
      collect_scriv: true
