---
name: Ingest Daily

# Daily incremental ingest (#164): re-pull JDs, dedup-merge into the running corpus (carried across
# runs as a GHA artifact — PUBLIC-repo artifacts are downloadable by anyone, so it is NOT private;
# the JD data is public job-postings and is never committed to a branch), refresh the keyword-trends
# series, and push the aggregate (keyword-only) trends to the `data` branch. Runs against the live
# network by design — distinct from the offline `make check` PR gate — so it is NOT exercised by PR
# CI. Validate changes via `workflow_dispatch` and read the run logs.
on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily (after overnight board refreshes)
  workflow_dispatch:

permissions: {}

concurrency:
  group: ingest-daily
  cancel-in-progress: false   # never interrupt a mid-run corpus write

jobs:
  ingest:
    name: incremental ingest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # `make trends-data` force-pushes public-data/trends.ndjson to the `data` branch
      actions: write    # `gh run download` (read) + `gh workflow run gh-pages.yaml` dispatch (write)
    env:
      AJOA_CONFIG_DIR: ${{ github.workspace }}/config
      AJOA_RESULTS_DIR: ${{ github.workspace }}/results
      # Absolute (not the relative default) because trend-snapshot runs under working-directory:
      # polyfetch-scrape, where a relative public-data/ would resolve wrong — same as AJOA_RESULTS_DIR.
      AJOA_PUBLIC_DATA_DIR: ${{ github.workspace }}/public-data
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Checkout (main repo; credentials kept for the data-branch push)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # polyfetch-scrape is public; borrow its env (httpx/curl_cffi/patchright fetch stack) rather
      # than vendoring it (architecture constraint). Must live inside the workspace — checkout
      # cannot write to a sibling `../` path.
      - name: Checkout polyfetch-scrape (public fetch stack)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: qte77/polyfetch-scrape
          path: polyfetch-scrape
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: polyfetch-scrape/uv.lock

      - name: Install the headless browser (tier-3 fallback)
        working-directory: polyfetch-scrape
        run: uv run patchright install --with-deps chromium

      # v4 artifacts are run-scoped, so pull the corpus from the most recent successful run.
      # First ever run finds none and proceeds with an empty prior corpus.
      - name: Restore the prior corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results
          run_id="$(gh run list --workflow ingest-daily.yaml --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --name corpus --dir results || echo "corpus artifact download failed"
            # Fail-loud guard (#191): a prior successful run exists, so its corpus SHOULD restore. If
            # it doesn't (artifact expired past retention / a >90-day lapse), do NOT silently start
            # from empty — that re-stamps every JD's first_seen and silently wipes the trend history.
            # Halt so a human decides (restore a backup, or intentionally re-seed).
            if [ ! -f results/corpus.json ]; then
              echo "::error::prior run $run_id found but its corpus artifact is missing — refusing to reseed (would reset first_seen); see #191." >&2
              exit 1
            fi
          else
            echo "first run — starting from an empty corpus"
          fi

      # Borrow polyfetch's env (run from its dir); add ajoa-kit's own deps with --with; reach
      # ajoa_kit itself via PYTHONPATH. Paths are absolute (AJOA_*_DIR) since the cwd is polyfetch's.
      - name: Ingest — incremental merge into results/corpus.json
        working-directory: polyfetch-scrape
        # --with lists every ajoa_kit dep absent from polyfetch's own env: defusedxml became
        # explicit when polyfetch 6f42aa2 dropped its arXiv vertical (and the transitive dep
        # this run had silently leaned on) — the 2026-07-04/05 cron failures.
        run: uv run --with pydantic --with pydantic-settings --with defusedxml python -m ajoa_kit ingest --merge

      # Seed the snapshot with the data branch's existing trends so trend-snapshot's per-week upsert
      # ACCUMULATES (keeps already-published weeks, adds/updates the corpus's first_seen weeks)
      # rather than replacing the series. Atomic via a tmp file: only overwrite on a clean read.
      - name: Restore existing trends from the data branch
        run: |
          git fetch --depth=1 origin data 2>/dev/null || true
          mkdir -p public-data
          # Restore the weekly, daily and monthly aggregate series so trend-snapshot's per-bucket
          # upsert ACCUMULATES (keeps already-published buckets, adds/updates this run's) rather
          # than replacing. Atomic via a tmp file: only overwrite on a clean read.
          for f in trends.ndjson trends-daily.ndjson trends-monthly.ndjson; do
            if git show "origin/data:public-data/$f" > "public-data/$f.tmp" 2>/dev/null; then
              mv "public-data/$f.tmp" "public-data/$f"
              echo "restored $(wc -l < "public-data/$f") lines -> public-data/$f"
            else
              rm -f "public-data/$f.tmp"
              echo "no public-data/$f on the data branch yet — starting fresh"
            fi
          done

      - name: Keyword-trend snapshot (buckets by first_seen)
        working-directory: polyfetch-scrape
        run: uv run --with pydantic --with pydantic-settings --with defusedxml python -m ajoa_kit trend-snapshot

      - name: Push aggregate trends to the data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          make trends-data

      - name: Upload the corpus (cross-run artifact store — NOT private on a public repo)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: corpus
          path: results/corpus.json
          # 90d (the artifact cap) buys headroom against a cron lapse resetting every first_seen — a
          # stopgap for the corpus's durability; the fuller fix is tracked (see issue). This repo is
          # PUBLIC, so this artifact is downloadable by anyone — it is NOT private. Accepted for now:
          # the records (company/title/url/description) are public job-postings, kept off all branches.
          retention-days: 90
          if-no-files-found: error

      # A push made with GITHUB_TOKEN does not fire push-triggered workflows (GitHub loop
      # prevention), so gh-pages.yaml's `on: push: [data]` never runs for this cron — the live
      # same-origin trends would stale despite the fresh `data` push (#251). Dispatch the deploy
      # explicitly (workflow_dispatch is the documented exception). Local/human `data` pushes and
      # `main` pushes still self-trigger, so they need no dispatch. Kept last: a dispatch hiccup
      # must never cost the corpus artifact above.
      - name: Trigger the Pages deploy (GITHUB_TOKEN pushes don't fire push events)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gh-pages.yaml
