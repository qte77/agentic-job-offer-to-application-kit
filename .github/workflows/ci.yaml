---
name: CI

# Docs-only changes skip this workflow (the lint-md-links workflow still runs on
# them). Safe because no status check is branch-protection-required, so a skipped
# job never leaves a PR "pending". Keep this list in sync with codeql.yaml.
on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'changelog.d/**'
      - 'examples/**/*.md'
      - '*.md'
      - 'lychee.toml'
      - '.markdownlint-cli2.jsonc'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'changelog.d/**'
      - 'examples/**/*.md'
      - '*.md'
      - 'lychee.toml'
      - '.markdownlint-cli2.jsonc'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Checks (ruff + pytest)
        run: make check   # same gate as local `make check`
