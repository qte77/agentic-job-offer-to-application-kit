---
name: CI

# Docs-only changes skip this workflow (the lint-md-links workflow still runs on
# them). Safe because no status check is branch-protection-required, so a skipped
# job never leaves a PR "pending". Keep this list in sync with codeql.yaml.
on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'changelog.d/**'
      - 'examples/**/*.md'
      - '*.md'
      - 'lychee.toml'
      - '.markdownlint-cli2.jsonc'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'changelog.d/**'
      - 'examples/**/*.md'
      - '*.md'
      - 'lychee.toml'
      - '.markdownlint-cli2.jsonc'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2

      - name: Checks (ruff + pytest)
        run: make check   # same gate as local `make check`
